<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0e1e38" />
      <stop offset="60%" stop-color="#080d1a" />
      <stop offset="100%" stop-color="#03060d" />
    </radialGradient>

    <!-- Bio-Luminescent Gradients -->
    <linearGradient id="dnaGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00C9A7" />
    </linearGradient>

    <linearGradient id="dnaGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="treeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="30%" stop-color="#38EF7D" />
      <stop offset="70%" stop-color="#11998E" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .brand-title {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      letter-spacing: 5px;
      fill: #ffffff;
    }
    .brand-sub {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      letter-spacing: 3.5px;
      fill: #00F2FE;
    }
    .meta-tag {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      fill: #94A3B8;
    }
  </style>

  <!-- Base Circle & Border -->
  <circle cx="400" cy="400" r="390" fill="url(#bgGlow)" stroke="#1E293B" stroke-width="4" />
  
  <!-- Outer Tech Ring -->
  <circle cx="400" cy="400" r="372" fill="none" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="8 12" />
  <circle cx="400" cy="400" r="360" fill="none" stroke="#10B981" stroke-opacity="0.15" stroke-width="1" />

  <!-- Orbiting Molecular Nodes -->
  <g opacity="0.7">
    <circle cx="160" cy="200" r="4" fill="#00F2FE" filter="url(#glow)" />
    <circle cx="640" cy="220" r="5" fill="#10B981" filter="url(#glow)" />
    <circle cx="680" cy="480" r="3.5" fill="#8B5CF6" filter="url(#glow)" />
    <circle cx="130" cy="520" r="4" fill="#FCD34D" filter="url(#glow)" />
    <line x1="160" y1="200" x2="190" y2="240" stroke="#00F2FE" stroke-opacity="0.2" stroke-width="1" />
    <line x1="640" y1="220" x2="600" y2="260" stroke="#10B981" stroke-opacity="0.2" stroke-width="1" />
  </g>

  <!-- Central Phylogenetic Tree & DNA Hybrid Icon -->
  <g transform="translate(0, -35)">
    <!-- Tree Lineage Hierarchy (Cladogram Branches) -->
    <!-- Root / Trunk rising from DNA -->
    <path d="M 400 450 L 400 320" stroke="url(#treeGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />

    <!-- Primary Lineage Splits (Internal Nodes) -->
    <!-- Left Major Branch (Mammalian / Amniote radiation) -->
    <path d="M 400 340 L 310 270" stroke="url(#treeGrad)" stroke-width="6" stroke-linecap="round" />
    <path d="M 310 270 L 310 220" stroke="url(#treeGrad)" stroke-width="5" stroke-linecap="round" />
    <!-- Sub-branches Left -->
    <path d="M 310 220 L 240 170" stroke="url(#dnaGrad1)" stroke-width="4" stroke-linecap="round" />
    <path d="M 310 220 L 360 170" stroke="url(#dnaGrad1)" stroke-width="4" stroke-linecap="round" />
    <!-- Terminal clades Left -->
    <path d="M 240 170 L 210 135" stroke="#00F2FE" stroke-width="3" stroke-linecap="round" />
    <path d="M 240 170 L 265 135" stroke="#00F2FE" stroke-width="3" stroke-linecap="round" />
    <path d="M 360 170 L 340 135" stroke="#38EF7D" stroke-width="3" stroke-linecap="round" />
    <path d="M 360 170 L 385 135" stroke="#38EF7D" stroke-width="3" stroke-linecap="round" />

    <!-- Right Major Branch (Sauropsid & Outgroup radiation) -->
    <path d="M 400 340 L 490 270" stroke="url(#treeGrad)" stroke-width="6" stroke-linecap="round" />
    <path d="M 490 270 L 490 220" stroke="url(#treeGrad)" stroke-width="5" stroke-linecap="round" />
    <!-- Sub-branches Right -->
    <path d="M 490 220 L 440 170" stroke="url(#dnaGrad2)" stroke-width="4" stroke-linecap="round" />
    <path d="M 490 220 L 560 170" stroke="url(#dnaGrad2)" stroke-width="4" stroke-linecap="round" />
    <!-- Terminal clades Right -->
    <path d="M 440 170 L 420 135" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
    <path d="M 440 170 L 460 135" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
    <path d="M 560 170 L 535 135" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" />
    <path d="M 560 170 L 585 135" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" />

    <!-- Deep Outgroup Branch (Teleostei / Danio rerio) -->
    <path d="M 400 380 L 570 340 L 610 300" stroke="#4FACFE" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="2 4" />
    <circle cx="610" cy="300" r="5" fill="#4FACFE" filter="url(#glow)" />

    <!-- Internal Tree Nodes (Bootstrap / Diversion Points) -->
    <circle cx="400" cy="340" r="8" fill="#FCD34D" filter="url(#glow)" />
    <circle cx="310" cy="270" r="6.5" fill="#00F2FE" filter="url(#glow)" />
    <circle cx="490" cy="270" r="6.5" fill="#10B981" filter="url(#glow)" />
    <circle cx="310" cy="220" r="5.5" fill="#38EF7D" />
    <circle cx="490" cy="220" r="5.5" fill="#38EF7D" />
    <circle cx="240" cy="170" r="5" fill="#00F2FE" />
    <circle cx="360" cy="170" r="5" fill="#00F2FE" />
    <circle cx="440" cy="170" r="5" fill="#10B981" />
    <circle cx="560" cy="170" r="5" fill="#8B5CF6" />

    <!-- Terminal Leaf Nodes (Taxa) with Glowing Halos -->
    <circle cx="210" cy="135" r="7" fill="#00F2FE" filter="url(#glowStrong)" />
    <circle cx="265" cy="135" r="7" fill="#00F2FE" filter="url(#glowStrong)" />
    <circle cx="340" cy="135" r="7" fill="#38EF7D" filter="url(#glowStrong)" />
    <circle cx="385" cy="135" r="7" fill="#38EF7D" filter="url(#glowStrong)" />
    <circle cx="420" cy="135" r="7" fill="#10B981" filter="url(#glowStrong)" />
    <circle cx="460" cy="135" r="7" fill="#10B981" filter="url(#glowStrong)" />
    <circle cx="535" cy="135" r="7" fill="#A78BFA" filter="url(#glowStrong)" />
    <circle cx="585" cy="135" r="7" fill="#A78BFA" filter="url(#glowStrong)" />

    <!-- Double Helix DNA Roots below Trunk -->
    <!-- Rungs / Base Pairs -->
    <g opacity="0.8">
      <line x1="365" y1="440" x2="435" y2="440" stroke="#00F2FE" stroke-width="3" stroke-linecap="round" />
      <circle cx="400" cy="440" r="3" fill="#ffffff" />
      <line x1="350" y1="475" x2="450" y2="475" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
      <circle cx="400" cy="475" r="3" fill="#ffffff" />
      <line x1="365" y1="510" x2="435" y2="510" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" />
      <circle cx="400" cy="510" r="3" fill="#ffffff" />
      <line x1="390" y1="545" x2="410" y2="545" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" />
      <circle cx="400" cy="545" r="3" fill="#ffffff" />
      <line x1="365" y1="580" x2="435" y2="580" stroke="#00F2FE" stroke-width="3" stroke-linecap="round" />
      <circle cx="400" cy="580" r="3" fill="#ffffff" />
      <line x1="350" y1="615" x2="450" y2="615" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
      <circle cx="400" cy="615" r="3" fill="#ffffff" />
    </g>

    <!-- DNA Strand 1 (Sine wave curve) -->
    <path d="M 400 420 
             C 330 450, 330 500, 400 545 
             C 470 590, 470 640, 400 670" 
          fill="none" stroke="url(#dnaGrad1)" stroke-width="7" stroke-linecap="round" filter="url(#glow)" />

    <!-- DNA Strand 2 (Opposite Sine wave curve) -->
    <path d="M 400 420 
             C 470 450, 470 500, 400 545 
             C 330 590, 330 640, 400 670" 
          fill="none" stroke="url(#dnaGrad2)" stroke-width="7" stroke-linecap="round" filter="url(#glow)" />
  </g>

  <!-- Typography / Brand Section -->
  <g transform="translate(400, 690)">
    <!-- Main Title -->
    <text x="0" y="0" text-anchor="middle" font-size="28" class="brand-title">SULEIMAN MEGA</text>
    <!-- Subtitle -->
    <text x="0" y="32" text-anchor="middle" font-size="16" class="brand-sub">MOLECULAR EVOLUTIONARY TREE</text>
    <!-- Metadata / Tag -->
    <text x="0" y="55" text-anchor="middle" class="meta-tag">PHYLOGENETICS &bull; MEGA 12 &bull; ITOL</text>
  </g>
</svg>
